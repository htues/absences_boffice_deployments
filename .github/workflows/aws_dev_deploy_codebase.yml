name: AWS_DEV_DEPLOY_CODEBASE

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: "Type 'deploy' to confirm GitOps validation"
        required: true
        type: string
      environment:
        description: "Environment to validate"
        required: true
        default: "dev"
        type: choice
        options:
          - dev

  workflow_call:
    inputs:
      confirmation:
        required: true
        type: string
      environment:
        required: true
        type: string

  push:
    branches:
      - main
    paths:
      - "k8s/helm/helm-chart-app/**"
      - "k8s/argocd/**"
      - ".github/workflows/aws_dev_deploy_codebase.yml"

permissions:
  contents: read

env:
  APP_NAME: ${{ vars.APP_NAME || 'absencesbo' }}
  APP_ENVIRONMENT: ${{ inputs.environment || 'dev' }}
  HELM_CHART_DIR: k8s/helm/helm-chart-app
  ARGOCD_ENV_DIR: k8s/argocd/envs/dev
  ARGOCD_PROJECT_DIR: k8s/argocd/projects

concurrency:
  group: AWS_DEV_DEPLOY_CODEBASE-${{ inputs.environment || 'dev' }}
  cancel-in-progress: false

jobs:
  validate-gitops-codebase:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: ${{ inputs.environment || 'dev' }}

    steps:
      - name: Guardrail - confirmation
        if: ${{ github.event_name == 'workflow_dispatch' }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ inputs.confirmation }}" != "deploy" ]]; then
            echo "Confirmation failed. You must type 'deploy'."
            exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Helm
        uses: azure/setup-helm@v4

      - name: Validate required GitOps files exist
        shell: bash
        run: |
          set -euo pipefail

          test -f "${HELM_CHART_DIR}/Chart.yaml"
          test -f "${HELM_CHART_DIR}/values.yaml"
          test -f "${HELM_CHART_DIR}/values-dev.yaml"

          test -f "${ARGOCD_PROJECT_DIR}/absencesbo-project.yml"
          test -f "${ARGOCD_ENV_DIR}/absencesbo-dev-namespace.yml"
          test -f "${ARGOCD_ENV_DIR}/absencesbo-dev-application.yml"

      - name: Helm lint dev chart
        shell: bash
        run: |
          set -euo pipefail
          helm lint "${HELM_CHART_DIR}" \
            --values "${HELM_CHART_DIR}/values-dev.yaml"

      - name: Render Helm chart for dev
        shell: bash
        run: |
          set -euo pipefail
          helm template absencesbo "${HELM_CHART_DIR}" \
            --namespace absencesbo-dev \
            --values "${HELM_CHART_DIR}/values-dev.yaml" \
            > /tmp/absencesbo-dev-rendered.yaml

          echo "Rendered manifest line count:"
          wc -l /tmp/absencesbo-dev-rendered.yaml

      - name: Validate ArgoCD manifests are YAML
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import yaml
          from pathlib import Path

          files = [
              Path("k8s/argocd/projects/absencesbo-project.yml"),
              Path("k8s/argocd/envs/dev/absencesbo-dev-namespace.yml"),
              Path("k8s/argocd/envs/dev/absencesbo-dev-application.yml"),
          ]

          for file in files:
              with file.open() as stream:
                  list(yaml.safe_load_all(stream))
              print(f"Valid YAML: {file}")
          PY

      - name: GitOps deployment summary
        if: always()
        shell: bash
        run: |
          {
            echo "### Dev Codebase GitOps Validation"
            echo ""
            echo "| Item | Value |"
            echo "| ---- | ----- |"
            echo "| Job Status | ${{ job.status }} |"
            echo "| Environment | ${APP_ENVIRONMENT} |"
            echo "| App | ${APP_NAME} |"
            echo "| Helm Chart | ${HELM_CHART_DIR} |"
            echo "| Values File | ${HELM_CHART_DIR}/values-dev.yaml |"
            echo "| ArgoCD Env Dir | ${ARGOCD_ENV_DIR} |"
            echo "| Deployment Owner | ArgoCD |"
            echo ""
            echo "### Result"
            echo "This workflow validates GitOps files only. ArgoCD owns the actual Kubernetes deployment and reconciliation."
          } >> "$GITHUB_STEP_SUMMARY"