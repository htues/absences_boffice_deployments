name: AWS_DEV_DEPLOY_CODEBASE

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: "Type 'deploy' to confirm GitOps validation"
        required: true
        type: string
      environment:
        description: "Environment to validate"
        required: true
        default: "dev"
        type: choice
        options:
          - dev
      backend_image_tag:
        description: "Backend image tag to deploy"
        required: false
        type: string
        default: ""
      frontend_image_tag:
        description: "Frontend image tag to deploy"
        required: false
        type: string
        default: ""

  workflow_call:
    inputs:
      confirmation:
        required: true
        type: string
      environment:
        required: true
        type: string
      backend_image_tag:
        required: false
        type: string
        default: ""
      frontend_image_tag:
        required: false
        type: string
        default: ""
      database_image_tag:
        required: false
        type: string
        default: ""

  push:
    branches:
      - main
    paths:
      - "k8s/helm/helm-chart-app/**"
      - "k8s/argocd/**"
      - ".github/workflows/aws_dev_deploy_codebase.yml"

permissions:
  contents: write

env:
  APP_NAME: ${{ vars.APP_NAME || 'absencesbo' }}
  APP_ENVIRONMENT: ${{ inputs.environment || 'dev' }}
  HELM_CHART_DIR: k8s/helm/helm-chart-app
  ARGOCD_ENV_DIR: k8s/argocd/envs/dev
  ARGOCD_PROJECT_DIR: k8s/argocd/projects
  BACKEND_IMAGE_TAG: ${{ inputs.backend_image_tag || '' }}
  FRONTEND_IMAGE_TAG: ${{ inputs.frontend_image_tag || '' }}
  DATABASE_IMAGE_TAG: ${{ inputs.database_image_tag || '' }}

concurrency:
  group: AWS_DEV_DEPLOY_CODEBASE-${{ inputs.environment || 'dev' }}
  cancel-in-progress: false

jobs:
  validate-gitops-codebase:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: ${{ inputs.environment || 'dev' }}

    steps:
      - name: Guardrail - confirmation
        if: ${{ github.event_name == 'workflow_dispatch' }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ inputs.confirmation }}" != "deploy" ]]; then
            echo "Confirmation failed. You must type 'deploy'."
            exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Helm
        uses: azure/setup-helm@v4

      - name: Validate required GitOps files exist
        shell: bash
        run: |
          set -euo pipefail

          test -f "${HELM_CHART_DIR}/Chart.yaml"
          test -f "${HELM_CHART_DIR}/values.yaml"
          test -f "${HELM_CHART_DIR}/values-dev.yaml"
          test -f "${HELM_CHART_DIR}/values-dev-be.yaml"
          test -f "${HELM_CHART_DIR}/values-dev-fe.yaml"

          test -f "${ARGOCD_PROJECT_DIR}/absencesbo-project.yml"
          test -f "${ARGOCD_ENV_DIR}/absencesbo-dev-namespace.yml"
          test -f "${ARGOCD_ENV_DIR}/absencesbo-dev-application.yml"

      - name: Check image tag inputs
        shell: bash
        run: |
          set -euo pipefail

          if [[ -z "${BACKEND_IMAGE_TAG}" && -z "${FRONTEND_IMAGE_TAG}" && -z "${DATABASE_IMAGE_TAG}" ]]; then
            echo "No image tags provided. Running validation only."
          fi

      - name: Update deployment values
        shell: bash
        run: |
          set -euo pipefail

          DEV_VALUES_FILE="${HELM_CHART_DIR}/values-dev.yaml"
          BE_VALUES_FILE="${HELM_CHART_DIR}/values-dev-be.yaml"
          FE_VALUES_FILE="${HELM_CHART_DIR}/values-dev-fe.yaml"

          if [[ -n "${BACKEND_IMAGE_TAG}" ]]; then
            yq -i '.backend.image.tag = strenv(BACKEND_IMAGE_TAG)' "${BE_VALUES_FILE}"
          fi

          if [[ -n "${FRONTEND_IMAGE_TAG}" ]]; then
            yq -i '.frontend.image.tag = strenv(FRONTEND_IMAGE_TAG)' "${FE_VALUES_FILE}"
          fi

          if [[ -n "${DATABASE_IMAGE_TAG}" ]]; then
            yq -i '.database.image.tag = strenv(DATABASE_IMAGE_TAG)' "${DEV_VALUES_FILE}"
          fi

          echo "Backend image:"
          yq '.backend.image' "${BE_VALUES_FILE}"

          echo "Frontend image:"
          yq '.frontend.image' "${FE_VALUES_FILE}"

          echo "Database image:"
          yq '.database.image' "${DEV_VALUES_FILE}"

      - name: Helm lint dev chart
        shell: bash
        run: |
          set -euo pipefail
          helm lint "${HELM_CHART_DIR}" \
          --values "${HELM_CHART_DIR}/values-dev.yaml" \
          --values "${HELM_CHART_DIR}/values-dev-be.yaml" \
          --values "${HELM_CHART_DIR}/values-dev-fe.yaml"

      - name: Render Helm chart for dev
        shell: bash
        run: |
          set -euo pipefail
          helm template absencesbo "${HELM_CHART_DIR}" \
            --namespace absencesbo-dev \
            --values "${HELM_CHART_DIR}/values-dev.yaml" \
            --values "${HELM_CHART_DIR}/values-dev-be.yaml" \
            --values "${HELM_CHART_DIR}/values-dev-fe.yaml" \          
            > /tmp/absencesbo-dev-rendered.yaml

          echo "Rendered manifest line count:"
          wc -l /tmp/absencesbo-dev-rendered.yaml

      - name: Validate ArgoCD manifests are YAML
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import yaml
          from pathlib import Path

          files = [
              Path("k8s/argocd/projects/absencesbo-project.yml"),
              Path("k8s/argocd/envs/dev/absencesbo-dev-namespace.yml"),
              Path("k8s/argocd/envs/dev/absencesbo-dev-application.yml"),
          ]

          for file in files:
              with file.open() as stream:
                  list(yaml.safe_load_all(stream))
              print(f"Valid YAML: {file}")
          PY

      - name: Commit deployment tag update
        shell: bash
        run: |
          set -euo pipefail

          DEV_VALUES_FILE="${HELM_CHART_DIR}/values-dev.yaml"
          BE_VALUES_FILE="${HELM_CHART_DIR}/values-dev-be.yaml"
          FE_VALUES_FILE="${HELM_CHART_DIR}/values-dev-fe.yaml"

          if git diff --quiet -- "${DEV_VALUES_FILE}" "${BE_VALUES_FILE}" "${FE_VALUES_FILE}"; then
            echo "No image tag changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add "${DEV_VALUES_FILE}" "${BE_VALUES_FILE}" "${FE_VALUES_FILE}"
          git commit -m "deploy dev image tags"
          git push

      - name: GitOps deployment summary
        if: always()
        shell: bash
        run: |
          {
            echo "### Dev Codebase GitOps Validation"
            echo ""
            echo "| Item | Value |"
            echo "| ---- | ----- |"
            echo "| Job Status | ${{ job.status }} |"
            echo "| Environment | ${APP_ENVIRONMENT} |"
            echo "| App | ${APP_NAME} |"
            echo "| Helm Chart | ${HELM_CHART_DIR} |"
            echo "| Dev Values File | ${HELM_CHART_DIR}/values-dev.yaml |"
            echo "| Backend Values File | ${HELM_CHART_DIR}/values-dev-be.yaml |"
            echo "| Frontend Values File | ${HELM_CHART_DIR}/values-dev-fe.yaml |"
            echo "| Backend Image Tag | ${BACKEND_IMAGE_TAG:-not provided} |"
            echo "| Frontend Image Tag | ${FRONTEND_IMAGE_TAG:-not provided} |"
            echo "| Database Image Tag | ${DATABASE_IMAGE_TAG:-not provided} |"
            echo "| ArgoCD Env Dir | ${ARGOCD_ENV_DIR} |"
            echo "| Deployment Owner | ArgoCD |"
            echo ""
            echo "### Result"
            echo "This workflow validates GitOps files and, when image tags are provided, commits the updated dev image tags for ArgoCD reconciliation."
          } >> "$GITHUB_STEP_SUMMARY"