name: AWS_DEV_DESTROY_IAC

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: "Type 'destroy' to confirm"
        required: true
        type: string
      environment:
        description: "Environment to destroy (dev only)"
        required: true
        type: choice
        options:
          - dev
        default: dev
      debug_oidc:
        description: "Print OIDC token claims to logs (DANGEROUS)"
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write

env:
  TF_VERSION: "1.10.0"
  TF_IN_AUTOMATION: "true"

  PROJECT_NAME: ${{ vars.APP_NAME || 'absencesbo' }}
  AWS_REGION: ${{ vars.AWS_REGION || 'us-east-2' }}
  ENVIRONMENT: ${{ inputs.environment }}
  APP_NODEPORT: "32322"

  BUCKET_NAME: ${{ (vars.APP_NAME || 'absencesbo') }}-terraform-state
  AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
  ACM_STATE_KEY: "shared/acm/terraform.tfstate"
  LB_STATE_KEY: "shared/load_balancer/terraform.tfstate"
  DNS_STATE_KEY: "shared/dns/terraform.tfstate"
  ROUTE53_STATE_KEY: "shared/route53/terraform.tfstate"

concurrency:
  group: ${{ github.workflow }}-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  destroy-dev-iac:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}

    steps:
      - name: Guardrail - confirmation
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ inputs.confirmation }}" != "destroy" ]]; then
            echo "Confirmation failed. You must type 'destroy'."
            exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: (Optional) Debug OIDC token claims
        if: ${{ inputs.debug_oidc }}
        uses: actions/github-script@v7
        with:
          script: |
            const token = await core.getIDToken('sts.amazonaws.com');
            const payload = JSON.parse(Buffer.from(token.split('.')[1], 'base64').toString());
            core.info(`aud=${payload.aud}`);
            core.info(`sub=${payload.sub}`);
            core.info(`iss=${payload.iss}`);
            core.info(`repository=${payload.repository}`);
            core.info(`workflow_ref=${payload.workflow_ref}`);
            core.info(`job_workflow_ref=${payload.job_workflow_ref}`);            

      - name: Validate AWS identity + region
        shell: bash
        run: |
          set -euo pipefail
          aws sts get-caller-identity
          CURRENT_REGION="${AWS_DEFAULT_REGION:-$(aws configure get region)}"
          if [[ "$CURRENT_REGION" != "${AWS_REGION}" ]]; then
            echo "Wrong region configured: $CURRENT_REGION. Must be ${AWS_REGION}"
            exit 1
          fi

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform fmt
        shell: bash
        run: |
          set -euo pipefail
          terraform -chdir=terraform/envs/dev fmt -check -recursive
          terraform -chdir=terraform/envs/shared/load_balancer fmt -check
          terraform -chdir=terraform/envs/shared/dns fmt -check

      - name: Ensure S3 State Bucket Exists
        shell: bash
        env:
          BUCKET_NAME: ${{ env.BUCKET_NAME }}
          AWS_REGION: ${{ env.AWS_REGION }}
        run: |
          set -euo pipefail
          chmod +x terraform/envs/shared/scripts/bootstrap-tf-backend.sh
          terraform/envs/shared/scripts/bootstrap-tf-backend.sh verify

      - name: Detect edge state files
        id: edge_state
        shell: bash
        run: |
          set -euo pipefail

          check_state_file() {
            local key="$1"
            if aws s3api head-object --bucket "${BUCKET_NAME}" --key "${key}" >/dev/null 2>&1; then
              echo "true"
            else
              echo "false"
            fi
          }

          HAS_DNS_STATE="$(check_state_file "${DNS_STATE_KEY}")"
          HAS_LB_STATE="$(check_state_file "${LB_STATE_KEY}")"
          HAS_ROUTE53_STATE="$(check_state_file "${ROUTE53_STATE_KEY}")"

          echo "has_dns_state=${HAS_DNS_STATE}" >> "$GITHUB_OUTPUT"
          echo "has_lb_state=${HAS_LB_STATE}" >> "$GITHUB_OUTPUT"
          echo "has_route53_state=${HAS_ROUTE53_STATE}" >> "$GITHUB_OUTPUT"

          echo "Detected states -> DNS: ${HAS_DNS_STATE}, LB: ${HAS_LB_STATE}, Route53: ${HAS_ROUTE53_STATE}"

          if [[ "${HAS_DNS_STATE}" == "true" && ( "${HAS_LB_STATE}" != "true" || "${HAS_ROUTE53_STATE}" != "true" ) ]]; then
            echo "DNS state exists but LB/Route53 state is missing; cannot safely destroy shared DNS artifacts."
            exit 1
          fi

      - name: Terraform init - DNS
        if: ${{ steps.edge_state.outputs.has_dns_state == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          terraform -chdir=terraform/envs/shared/dns init -reconfigure \
            -backend-config="bucket=${{ env.BUCKET_NAME }}" \
            -backend-config="key=${{ env.DNS_STATE_KEY }}" \
            -backend-config="region=${{ env.AWS_REGION }}" \
            -backend-config="encrypt=true" \
            -backend-config="use_lockfile=true"

      - name: Terraform validate - DNS
        if: ${{ steps.edge_state.outputs.has_dns_state == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          terraform -chdir=terraform/envs/shared/dns validate

      - name: Terraform destroy - DNS
        if: ${{ steps.edge_state.outputs.has_dns_state == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          terraform -chdir=terraform/envs/shared/dns destroy -auto-approve \
            -var="project_name=${{ env.PROJECT_NAME }}" \
            -var="aws_region=${{ env.AWS_REGION }}" \
            -var="route53_state_bucket=${{ env.BUCKET_NAME }}" \
            -var="route53_state_key=${{ env.ROUTE53_STATE_KEY }}" \
            -var="route53_state_region=${{ env.AWS_REGION }}" \
            -var="lb_state_bucket=${{ env.BUCKET_NAME }}" \
            -var="lb_state_key=${{ env.LB_STATE_KEY }}" \
            -var="lb_state_region=${{ env.AWS_REGION }}"

      - name: Terraform init - Load Balancer
        if: ${{ steps.edge_state.outputs.has_lb_state == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          terraform -chdir=terraform/envs/shared/load_balancer init -reconfigure \
            -backend-config="bucket=${{ env.BUCKET_NAME }}" \
            -backend-config="key=${{ env.LB_STATE_KEY }}" \
            -backend-config="region=${{ env.AWS_REGION }}" \
            -backend-config="encrypt=true" \
            -backend-config="use_lockfile=true"

      - name: Terraform validate - Load Balancer
        if: ${{ steps.edge_state.outputs.has_lb_state == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          terraform -chdir=terraform/envs/shared/load_balancer validate

      - name: Terraform destroy - Load Balancer
        if: ${{ steps.edge_state.outputs.has_lb_state == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          terraform -chdir=terraform/envs/shared/load_balancer destroy -auto-approve \
            -var="project_name=${{ env.PROJECT_NAME }}" \
            -var="aws_region=${{ env.AWS_REGION }}" \
            -var="app_nodeport=${{ env.APP_NODEPORT }}" \
            -var="acm_state_bucket=${{ env.BUCKET_NAME }}" \
            -var="acm_state_key=${{ env.ACM_STATE_KEY }}" \
            -var="acm_state_region=${{ env.AWS_REGION }}"

      - name: Terraform init - Dev
        shell: bash
        run: |
          set -euo pipefail
          terraform -chdir=terraform/envs/dev init -reconfigure \
            -backend-config="bucket=${{ env.BUCKET_NAME }}" \
            -backend-config="key=${{ env.ENVIRONMENT }}/dev/terraform.tfstate" \
            -backend-config="region=${{ env.AWS_REGION }}" \
            -backend-config="encrypt=true"

      - name: Terraform validate - Dev
        shell: bash
        run: |
          set -euo pipefail
          terraform -chdir=terraform/envs/dev validate

      - name: Terraform destroy dev infrastructure
        shell: bash
        run: |
          set -euo pipefail
          terraform -chdir=terraform/envs/dev destroy -auto-approve \
            -var="aws_region=${{ env.AWS_REGION }}" \
            -var="project_name=${{ env.PROJECT_NAME }}" \
            -var="environment=${{ env.ENVIRONMENT }}"

      - name: Destroy summary
        if: always()
        shell: bash
        run: |
          {
            echo "### Dev Compute IaC Destroy Status"
            echo ""
            echo "| Item | Value |"
            echo "| ---- | ----- |"
            echo "| Job Status | ${{ job.status }} |"
            echo "| Environment | ${{ env.ENVIRONMENT }} |"
            echo "| Project | ${{ env.PROJECT_NAME }} |"
            echo "| Region | ${{ env.AWS_REGION }} |"
            echo "| Edge DNS State Found | ${{ steps.edge_state.outputs.has_dns_state || 'false' }} |"
            echo "| Edge LB State Found | ${{ steps.edge_state.outputs.has_lb_state || 'false' }} |"
            echo "| Destroy Scope | Edge DNS + Edge NLB + Dev Compute/Network Artifacts |"
            echo "| Destroyed | DNS records (if state found), NLB resources (if state found), VM, VPC, NAT, EBS |"
            echo ""
            echo "### Note"
            echo "Route53 zone, ACM certificate, and shared instance access should be destroyed separately using the **AWS_DESTROY_DOMAIN_IAC** workflow if needed."
          } >> "$GITHUB_STEP_SUMMARY"