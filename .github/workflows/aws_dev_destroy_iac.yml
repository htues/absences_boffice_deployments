name: AWS_DEV_DESTROY_IAC

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: "Type 'destroy' to confirm"
        required: true
        type: string
      environment:
        description: "Environment to destroy (dev only)"
        required: true
        type: choice
        options:
          - dev
        default: dev
      debug_oidc:
        description: "Print OIDC token claims to logs (DANGEROUS)"
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write

env:
  TF_VERSION: "1.10.0"
  TF_IN_AUTOMATION: "true"

  PROJECT_NAME: ${{ vars.APP_NAME || 'absencesbo' }}
  AWS_REGION: ${{ vars.AWS_REGION || 'us-east-2' }}
  ENVIRONMENT: ${{ inputs.environment }}

  BUCKET_NAME: ${{ (vars.APP_NAME || 'absencesbo') }}-terraform-state
  AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}

concurrency:
  group: ${{ github.workflow }}-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  destroy-dev-iac:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}

    steps:
      - name: Guardrail - confirmation
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ inputs.confirmation }}" != "destroy" ]]; then
            echo "Confirmation failed. You must type 'destroy'."
            exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: (Optional) Debug OIDC token claims
        if: ${{ inputs.debug_oidc }}
        uses: actions/github-script@v7
        with:
          script: |
            const token = await core.getIDToken('sts.amazonaws.com');
            const payload = JSON.parse(Buffer.from(token.split('.')[1], 'base64').toString());
            core.info(`aud=${payload.aud}`);
            core.info(`sub=${payload.sub}`);
            core.info(`iss=${payload.iss}`);
            core.info(`repository=${payload.repository}`);
            core.info(`workflow_ref=${payload.workflow_ref}`);
            core.info(`job_workflow_ref=${payload.job_workflow_ref}`);            

      - name: Validate AWS identity + region
        shell: bash
        run: |
          set -euo pipefail
          aws sts get-caller-identity
          CURRENT_REGION="${AWS_DEFAULT_REGION:-$(aws configure get region)}"
          if [[ "$CURRENT_REGION" != "${AWS_REGION}" ]]; then
            echo "Wrong region configured: $CURRENT_REGION. Must be ${AWS_REGION}"
            exit 1
          fi

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform fmt
        shell: bash
        run: |
          set -euo pipefail
          terraform -chdir=terraform/envs/dev fmt -check -recursive

      - name: Ensure S3 State Bucket Exists
        shell: bash
        env:
          BUCKET_NAME: ${{ env.BUCKET_NAME }}
          AWS_REGION: ${{ env.AWS_REGION }}
        run: |
          set -euo pipefail
          chmod +x terraform/envs/shared/scripts/bootstrap-tf-backend.sh
          terraform/envs/shared/scripts/bootstrap-tf-backend.sh verify

      - name: Terraform init
        shell: bash
        run: |
          set -euo pipefail
          terraform -chdir=terraform/envs/dev init -reconfigure \
            -backend-config="bucket=${{ env.BUCKET_NAME }}" \
            -backend-config="key=${{ env.ENVIRONMENT }}/dev/terraform.tfstate" \
            -backend-config="region=${{ env.AWS_REGION }}" \
            -backend-config="encrypt=true"

      - name: Terraform validate
        shell: bash
        run: |
          set -euo pipefail
          terraform -chdir=terraform/envs/dev validate

      - name: Terraform destroy dev infrastructure
        shell: bash
        run: |
          set -euo pipefail
          terraform -chdir=terraform/envs/dev destroy -auto-approve \
            -var="aws_region=${{ env.AWS_REGION }}" \
            -var="project_name=${{ env.PROJECT_NAME }}" \
            -var="environment=${{ env.ENVIRONMENT }}"

      - name: Destroy summary
        if: always()
        shell: bash
        run: |
          {
            echo "### Dev Compute IaC Destroy Status"
            echo ""
            echo "| Item | Value |"
            echo "| ---- | ----- |"
            echo "| Job Status | ${{ job.status }} |"
            echo "| Environment | ${{ env.ENVIRONMENT }} |"
            echo "| Project | ${{ env.PROJECT_NAME }} |"
            echo "| Region | ${{ env.AWS_REGION }} |"
            echo "| Destroy Scope | Dev Compute + Network Artifacts |"
            echo "| Destroyed | VM, VPC, EIP, EBS |"
            echo ""
            echo "### Note"
            echo "Load Balancer and DNS records should be destroyed separately using the **AWS DESTROY EDGE IAC** workflow if needed."
          } >> "$GITHUB_STEP_SUMMARY"