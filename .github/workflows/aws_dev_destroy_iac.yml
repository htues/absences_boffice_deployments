name: AWS_DEV_DESTROY_IAC

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: "Type 'destroy' to confirm"
        required: true
        type: string
      environment:
        description: "Environment to destroy (experimental only for dev)"
        required: true
        type: choice
        options:
          - experimental
        default: experimental
      debug_oidc:
        description: "Print OIDC token claims to logs (DANGEROUS)"
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write

env:
  TF_VERSION: "1.10.0"
  TF_IN_AUTOMATION: "true"

  PROJECT_NAME: ${{ vars.APP_NAME || 'absencesbo' }}
  AWS_REGION: ${{ vars.AWS_REGION || 'us-east-2' }}
  ENVIRONMENT: ${{ inputs.environment }}

  BUCKET_NAME: ${{ (vars.APP_NAME || 'absencesbo') }}-terraform-state
  AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
  ACM_CERTIFICATE_DEV_APP_ARN: ${{ vars.ACM_CERTIFICATE_DEV_APP_ARN || 'arn:aws:acm:us-east-2:482619384845:certificate/0539426b-6c6e-46f7-a50a-9c29b08c2a70' }}
  ROUTE53_ZONE_ID: ${{ vars.ROUTE53_ZONE_ID }}

concurrency:
  group: ${{ github.workflow }}-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  destroy-dev-iac:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}

    steps:
      - name: Guardrail - confirmation
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ inputs.confirmation }}" != "destroy" ]]; then
            echo "Confirmation failed. You must type 'destroy'."
            exit 1
          fi

      - name: Guardrail - required scaffold variables
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${ROUTE53_ZONE_ID}" ]]; then
            echo "ROUTE53_ZONE_ID is required so destroy can remove alias records without owning the hosted zone."
            exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: (Optional) Debug OIDC token claims
        if: ${{ inputs.debug_oidc }}
        uses: actions/github-script@v7
        with:
          script: |
            const token = await core.getIDToken('sts.amazonaws.com');
            const payload = JSON.parse(Buffer.from(token.split('.')[1], 'base64').toString());
            core.info(`aud=${payload.aud}`);
            core.info(`sub=${payload.sub}`);
            core.info(`iss=${payload.iss}`);

      - name: Validate AWS identity + region
        shell: bash
        run: |
          set -euo pipefail
          aws sts get-caller-identity
          CURRENT_REGION="${AWS_DEFAULT_REGION:-$(aws configure get region)}"
          if [[ "$CURRENT_REGION" != "${AWS_REGION}" ]]; then
            echo "Wrong region configured: $CURRENT_REGION. Must be ${AWS_REGION}"
            exit 1
          fi

      - name: Ensure S3 State Bucket Exists
        shell: bash
        env:
          BUCKET_NAME: ${{ env.BUCKET_NAME }}
          AWS_REGION: ${{ env.AWS_REGION }}
        run: |
          set -euo pipefail
          chmod +x devops/scripts/bootstrap-tf-backend.sh
          devops/scripts/bootstrap-tf-backend.sh verify

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform fmt
        shell: bash
        run: |
          set -euo pipefail
          cd devops/terraform/dev
          terraform fmt -check -recursive

      - name: Terraform init
        shell: bash
        run: |
          set -euo pipefail
          cd devops/terraform/dev
          terraform init -reconfigure \
            -backend-config="bucket=${{ env.BUCKET_NAME }}" \
            -backend-config="key=${{ env.ENVIRONMENT }}/dev/terraform.tfstate" \
            -backend-config="region=${{ env.AWS_REGION }}" \
            -backend-config="encrypt=true"
          
          terraform state rm 'aws_route53_zone.root[0]' || true

      - name: Terraform validate
        shell: bash
        run: |
          set -euo pipefail
          cd devops/terraform/dev
          terraform validate

      - name: Terraform destroy dev infrastructure
        shell: bash
        run: |
          set -euo pipefail
          cd devops/terraform/dev
          terraform destroy -auto-approve \
            -var="aws_region=${{ env.AWS_REGION }}" \
            -var="project_name=${{ env.PROJECT_NAME }}" \
            -var="environment=${{ env.ENVIRONMENT }}" \
            -var="route53_zone_id=${{ env.ROUTE53_ZONE_ID }}" \
            -var="acm_certificate_dev_app_arn=${{ env.ACM_CERTIFICATE_DEV_APP_ARN }}"

      - name: Destroy summary
        if: always()
        shell: bash
        run: |
          {
            echo "### Dev IaC Destroy Status"
            echo ""
            echo "| Item | Value |"
            echo "| ---- | ----- |"
            echo "| Job Status | ${{ job.status }} |"
            echo "| Destroy Scope | Full dev runtime stack |"
            echo "| Destroyed | VM, VPC, Load Balancer, target group, listeners, EBS, EIP, IAM, Route 53 alias records |"
            echo "| Preserved | ACM certificate, Route 53 hosted zone |"
            echo "| Cluster Type | EC2 + k3s |"
            echo "| Environment | ${ENVIRONMENT} |"
            echo "| Region | ${AWS_REGION} |"
            echo "| Project | ${PROJECT_NAME} |"
            echo "| Route53 Zone ID | ${ROUTE53_ZONE_ID} |"
            echo "| ACM Certificate DevApp ARN | ${ACM_CERTIFICATE_DEV_APP_ARN} |"
          } >> "$GITHUB_STEP_SUMMARY"