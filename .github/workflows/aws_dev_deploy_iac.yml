name: AWS_DEV_DEPLOY_IAC

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: "Type 'deploy' to confirm"
        required: true
        type: string
      environment:
        description: "Environment to deploy (experimental only for dev)"
        required: true
        type: choice
        options:
          - experimental
        default: experimental
      debug_oidc:
        description: "Print OIDC token claims to logs (DANGEROUS)"
        required: false
        type: boolean
        default: false

  workflow_call:
    inputs:
      confirmation:
        required: true
        type: string
      environment:
        required: true
        type: string
      debug_oidc:
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write

env:
  TF_VERSION: "1.10.0"
  TF_IN_AUTOMATION: "true"

  CLUSTER_NAME: ${{ vars.CLUSTER_NAME || 'absencesbo-cluster' }}
  PROJECT_NAME: ${{ vars.APP_NAME || 'absencesbo' }}
  AWS_REGION: ${{ vars.AWS_REGION || 'us-east-2' }}
  ENVIRONMENT: ${{ inputs.environment }}

  BUCKET_NAME: ${{ (vars.APP_NAME || 'absencesbo') }}-terraform-state
  AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
  ACM_CERTIFICATE_DEV_APP_ARN: ${{ vars.ACM_CERTIFICATE_DEV_APP_ARN || 'arn:aws:acm:us-east-2:482619384845:certificate/0539426b-6c6e-46f7-a50a-9c29b08c2a70' }}
  ROUTE53_ZONE_ID: ${{ vars.ROUTE53_ZONE_ID }}

  KUBECTL_VERSION: "v1.30.11"
  ADDON_NAME: "aws-ebs-csi-driver"

  REQUIRE_SSH_KEY_PAIR: ${{ vars.REQUIRE_SSH_KEY_PAIR || 'true' }}
  CREATE_SSH_KEY_PAIR: ${{ vars.CREATE_SSH_KEY_PAIR || 'true' }}

  K3S_VERSION: "v1.30.2+k3s1"
  NODE_NAME: ${{ vars.APP_NAME || 'absencesbo' }}-${{ inputs.environment }}-node

concurrency:
  group: AWS_DEV_DEPLOY_IAC-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  deploy-dev-iac:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}

    outputs:
      instance_id: ${{ steps.terraform_outputs.outputs.instance_id }}
      public_ip: ${{ steps.terraform_outputs.outputs.public_ip }}
      load_balancer_dns_name: ${{ steps.terraform_outputs.outputs.load_balancer_dns_name }}
      load_balancer_url: ${{ steps.terraform_outputs.outputs.load_balancer_url }}
      app_nodeport: ${{ steps.terraform_outputs.outputs.app_nodeport }}
      route53_zone_id: ${{ steps.terraform_outputs.outputs.route53_zone_id }}
      route53_zone_name: ${{ steps.terraform_outputs.outputs.route53_zone_name }}
      route53_name_servers: ${{ steps.terraform_outputs.outputs.route53_name_servers }}
      route53_record_names: ${{ steps.terraform_outputs.outputs.route53_record_names }}
      application_urls: ${{ steps.terraform_outputs.outputs.application_urls }}

    steps:
      - name: Guardrail - confirmation
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ inputs.confirmation }}" != "deploy" ]]; then
            echo "Confirmation failed. You must type 'deploy'."
            exit 1
          fi

      - name: Guardrail - required scaffold variables
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${ROUTE53_ZONE_ID}" ]]; then
            echo "ROUTE53_ZONE_ID is required so the dev stack only manages Route 53 alias records, not the hosted zone."
            exit 1
          fi          

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: (Optional) Debug OIDC token claims
        if: ${{ inputs.debug_oidc }}
        uses: actions/github-script@v7
        with:
          script: |
            const token = await core.getIDToken('sts.amazonaws.com');
            const payload = JSON.parse(Buffer.from(token.split('.')[1], 'base64').toString());
            core.info(`aud=${payload.aud}`);
            core.info(`sub=${payload.sub}`);
            core.info(`iss=${payload.iss}`);

      - name: Validate AWS identity + region
        shell: bash
        run: |
          set -euo pipefail
          aws sts get-caller-identity
          CURRENT_REGION="${AWS_DEFAULT_REGION:-$(aws configure get region)}"
          if [[ "$CURRENT_REGION" != "${AWS_REGION}" ]]; then
            echo "Wrong region configured: $CURRENT_REGION. Must be ${AWS_REGION}"
            exit 1
          fi

      - name: Ensure S3 State Bucket Exists
        shell: bash
        env:
          BUCKET_NAME: ${{ env.BUCKET_NAME }}
          AWS_REGION: ${{ env.AWS_REGION }}
        run: |
          set -euo pipefail
          chmod +x devops/scripts/bootstrap-tf-backend.sh
          devops/scripts/bootstrap-tf-backend.sh verify

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform fmt
        shell: bash
        run: |
          set -euo pipefail
          cd devops/terraform/dev
          terraform fmt -check -recursive

      - name: Terraform init
        shell: bash
        run: |
          set -euo pipefail
          cd devops/terraform/dev
          terraform init -reconfigure \
            -backend-config="bucket=${{ env.BUCKET_NAME }}" \
            -backend-config="key=${{ env.ENVIRONMENT }}/dev/terraform.tfstate" \
            -backend-config="region=${{ env.AWS_REGION }}" \
            -backend-config="encrypt=true"

      - name: Terraform validate
        shell: bash
        run: |
          set -euo pipefail
          cd devops/terraform/dev
          terraform validate

      - name: Terraform apply
        shell: bash
        run: |
          set -euo pipefail
          cd devops/terraform/dev
          terraform apply -auto-approve \
            -var="aws_region=${{ env.AWS_REGION }}" \
            -var="project_name=${{ env.PROJECT_NAME }}" \
            -var="environment=${{ env.ENVIRONMENT }}" \
            -var="require_ssh_key_pair=${{ env.REQUIRE_SSH_KEY_PAIR }}" \
            -var="create_ssh_key_pair=${{ env.CREATE_SSH_KEY_PAIR }}" \
            -var="route53_zone_id=${{ env.ROUTE53_ZONE_ID }}" \
            -var="acm_certificate_dev_app_arn=${{ env.ACM_CERTIFICATE_DEV_APP_ARN }}"

      - name: Export Terraform outputs
        id: terraform_outputs
        shell: bash
        run: |
          set -euo pipefail
          cd devops/terraform/dev

          INSTANCE_ID="$(terraform output -raw instance_id)"
          PUBLIC_IP="$(terraform output -raw public_ip)"
          LOAD_BALANCER_DNS_NAME="$(terraform output -raw load_balancer_dns_name)"
          LOAD_BALANCER_URL="$(terraform output -raw load_balancer_url)"
          APP_NODEPORT="$(terraform output -raw app_nodeport)"
          ROUTE53_ZONE_ID="$(terraform output -raw route53_zone_id)"
          ROUTE53_ZONE_NAME="$(terraform output -raw route53_zone_name)"
          ROUTE53_NAME_SERVERS="$(terraform output -json route53_name_servers | jq -r 'join(", ")')"
          ROUTE53_RECORD_NAMES="$(terraform output -json route53_record_names | jq -r 'join(", ")')"
          APPLICATION_URLS="$(terraform output -json application_urls | jq -r 'join(", ")')"
          
          if [[ -z "${INSTANCE_ID}" ]]; then
            echo "Terraform output instance_id is empty."
            exit 1
          fi

          if [[ -z "${PUBLIC_IP}" ]]; then
            echo "Terraform output public_ip is empty."
            exit 1
          fi

          if [[ -z "${LOAD_BALANCER_DNS_NAME}" ]]; then
            echo "Terraform output load_balancer_dns_name is empty."
            exit 1
          fi

          if [[ -z "${LOAD_BALANCER_URL}" ]]; then
            echo "Terraform output load_balancer_url is empty."
            exit 1
          fi

          if [[ -z "${APP_NODEPORT}" ]]; then
            echo "Terraform output app_nodeport is empty."
            exit 1
          fi
          
          if [[ -z "${ROUTE53_ZONE_ID}" ]]; then
            echo "Terraform output route53_zone_id is empty."
            exit 1
          fi

          if [[ -z "${ROUTE53_ZONE_NAME}" ]]; then
            echo "Terraform output route53_zone_name is empty."
            exit 1
          fi          

          echo "INSTANCE_ID=${INSTANCE_ID}"
          echo "PUBLIC_IP=${PUBLIC_IP}"
          echo "LOAD_BALANCER_DNS_NAME=${LOAD_BALANCER_DNS_NAME}"
          echo "LOAD_BALANCER_URL=${LOAD_BALANCER_URL}"
          echo "APP_NODEPORT=${APP_NODEPORT}"
          echo "ROUTE53_ZONE_ID=${ROUTE53_ZONE_ID}"
          echo "ROUTE53_ZONE_NAME=${ROUTE53_ZONE_NAME}"
          echo "ROUTE53_NAME_SERVERS=${ROUTE53_NAME_SERVERS}"
          echo "ROUTE53_RECORD_NAMES=${ROUTE53_RECORD_NAMES}"
          echo "APPLICATION_URLS=${APPLICATION_URLS}"          

          echo "instance_id=${INSTANCE_ID}" >> "$GITHUB_OUTPUT"
          echo "public_ip=${PUBLIC_IP}" >> "$GITHUB_OUTPUT"
          echo "load_balancer_dns_name=${LOAD_BALANCER_DNS_NAME}" >> "$GITHUB_OUTPUT"
          echo "load_balancer_url=${LOAD_BALANCER_URL}" >> "$GITHUB_OUTPUT"
          echo "app_nodeport=${APP_NODEPORT}" >> "$GITHUB_OUTPUT"
          echo "route53_zone_id=${ROUTE53_ZONE_ID}" >> "$GITHUB_OUTPUT"
          echo "route53_zone_name=${ROUTE53_ZONE_NAME}" >> "$GITHUB_OUTPUT"
          echo "route53_name_servers=${ROUTE53_NAME_SERVERS}" >> "$GITHUB_OUTPUT"
          echo "route53_record_names=${ROUTE53_RECORD_NAMES}" >> "$GITHUB_OUTPUT"
          echo "application_urls=${APPLICATION_URLS}" >> "$GITHUB_OUTPUT"          

      - name: Show application endpoint
        shell: bash
        run: |
          set -euo pipefail
          
          echo "Application URL: ${{ steps.terraform_outputs.outputs.load_balancer_url }}"
          echo "Application DNS URLs: ${{ steps.terraform_outputs.outputs.application_urls }}"
          echo "Load Balancer DNS name: ${{ steps.terraform_outputs.outputs.load_balancer_dns_name }}"
          echo "NodePort: ${{ steps.terraform_outputs.outputs.app_nodeport }}"
          echo "ACM Certificate DevApp ARN: ${{ env.ACM_CERTIFICATE_DEV_APP_ARN }}"
          echo "Route53 Zone ID: ${{ steps.terraform_outputs.outputs.route53_zone_id }}"
          echo "Route53 Zone Name: ${{ steps.terraform_outputs.outputs.route53_zone_name }}"
          echo "Route53 Name Servers: ${{ steps.terraform_outputs.outputs.route53_name_servers }}"
          echo "Route53 Record Names: ${{ steps.terraform_outputs.outputs.route53_record_names }}"

      - name: Verify SSM is online
        shell: bash
        run: |
          set -euo pipefail
          INSTANCE_ID="${{ steps.terraform_outputs.outputs.instance_id }}"

          echo "Waiting for SSM to be online for ${INSTANCE_ID}..."
          SSM_STATUS=""
          for i in {1..45}; do
            SSM_STATUS="$(aws ssm describe-instance-information \
              --region "${AWS_REGION}" \
              --filters "Key=InstanceIds,Values=${INSTANCE_ID}" \
              --query 'InstanceInformationList[0].PingStatus' \
              --output text 2>/dev/null || true)"

            if [[ "${SSM_STATUS}" == "Online" ]]; then
              echo "SSM is online."
              break
            fi

            echo "Waiting for SSM... (${i}/45)"
            sleep 10
          done

          if [[ "${SSM_STATUS}" != "Online" ]]; then
            echo "Instance never became available in SSM."
            aws ssm describe-instance-information \
              --region "${AWS_REGION}" \
              --filters "Key=InstanceIds,Values=${INSTANCE_ID}" \
              --query 'InstanceInformationList[].{InstanceId:InstanceId,PingStatus:PingStatus,PlatformName:PlatformName,AgentVersion:AgentVersion,AssociationStatus:AssociationStatus}' \
              --output table || true
            exit 1
          fi

      - name: Setup Ansible virtualenv
        shell: bash
        run: |
          set -euo pipefail

          python3 -m venv .venv-ansible
          source .venv-ansible/bin/activate

          python -m pip install --upgrade pip
          pip install "ansible-core==2.17.13" boto3 botocore
          ansible-galaxy collection install \
            "amazon.aws:==9.2.0" \
            "community.aws:==9.0.0" \
            "community.general:==10.3.0"

          echo "VENV_PYTHON=$PWD/.venv-ansible/bin/python" >> "$GITHUB_ENV"
          echo "VENV_ANSIBLE=$PWD/.venv-ansible/bin/ansible" >> "$GITHUB_ENV"
          echo "VENV_ANSIBLE_PLAYBOOK=$PWD/.venv-ansible/bin/ansible-playbook" >> "$GITHUB_ENV"
          echo "$PWD/.venv-ansible/bin" >> "$GITHUB_PATH"

      - name: Debug Ansible virtualenv
        shell: bash
        run: |
          set -euo pipefail

          "${VENV_PYTHON}" --version
          "${VENV_PYTHON}" -c "import boto3, botocore; print('boto3:', boto3.__version__); print('botocore:', botocore.__version__)"
          "${VENV_ANSIBLE}" --version

      - name: Build dynamic inventory for dev VM
        shell: bash
        env:
          INVENTORY_PATH: devops/terraform/dev/inventory.ini
          INSTANCE_ID: ${{ steps.terraform_outputs.outputs.instance_id }}
          PUBLIC_IP: ${{ steps.terraform_outputs.outputs.public_ip }}
        run: |
          set -euo pipefail

          echo "Inventory source values:"
          echo "INSTANCE_ID=${INSTANCE_ID}"
          echo "PUBLIC_IP=${PUBLIC_IP}"

          if [[ -z "${INSTANCE_ID}" ]]; then
            echo "INSTANCE_ID is empty; cannot build SSM inventory."
            exit 1
          fi

          mkdir -p "$(dirname "${INVENTORY_PATH}")"

          cat > "${INVENTORY_PATH}" <<EOF
          [dev_vm]
          dev-node ansible_host=${INSTANCE_ID} ansible_connection=community.aws.aws_ssm ansible_aws_ssm_bucket_name=${BUCKET_NAME} ansible_aws_ssm_region=${AWS_REGION}
          EOF

          echo "Generated inventory:"
          cat "${INVENTORY_PATH}"

      - name: Diagnose Ansible connection plugins
        shell: bash
        run: |
          set -euo pipefail
          echo "Ansible version:"
          ansible --version
          echo
          echo "Installed collections:"
          ansible-galaxy collection list
          echo
          echo "Trying community.aws.aws_ssm:"
          ansible-doc -t connection community.aws.aws_ssm
          echo
          echo "Trying amazon.aws.aws_ssm:"
          ansible-doc -t connection amazon.aws.aws_ssm || true          

      - name: Inspect Ansible role layout
        shell: bash
        run: |
          set -euo pipefail
          cd devops
          export ANSIBLE_CONFIG="$PWD/ansible.cfg"
  
          echo "Current directory: $(pwd)"
          echo "Role tree:"
          find roles/dev-vm-bootstrap -maxdepth 3 -type f | sort

      - name: Check remote OS
        shell: bash
        run: |
          set -euo pipefail
          cd devops
          export ANSIBLE_CONFIG="$PWD/ansible.cfg"
          
          ansible dev-node -i terraform/dev/inventory.ini -m raw -a "cat /etc/os-release" || true

      - name: Run Ansible bootstrap over SSM
        shell: bash
        run: |
          set -euo pipefail
          cd devops
          export ANSIBLE_CONFIG="$PWD/ansible.cfg"

          "${VENV_ANSIBLE}" --version
          "${VENV_ANSIBLE_PLAYBOOK}" \
            -i terraform/dev/inventory.ini \
            playbooks/dev-vm-bootstrap.yml \
            -e "k3s_version=${K3S_VERSION}" \
            -e "node_name=${NODE_NAME}" \
            -e "helm_required=true" \
            -e "ansible_python_interpreter=/usr/bin/python3" \
            --skip-tags never

      - name: Verify VM-ready contract
        shell: bash
        env:
          INSTANCE_ID: ${{ steps.terraform_outputs.outputs.instance_id }}
        run: |
          set -euo pipefail

          if [[ -z "${INSTANCE_ID}" ]]; then
            echo "INSTANCE_ID is empty; cannot verify VM-ready contract."
            exit 1
          fi

          echo "Final verification through SSM..."
          echo "INSTANCE_ID=${INSTANCE_ID}"

          COMMAND_ID="$(aws ssm send-command \
            --region "${AWS_REGION}" \
            --instance-ids "${INSTANCE_ID}" \
            --document-name "AWS-RunShellScript" \
            --comment "Verify dev VM ready contract" \
            --parameters commands='[
              "test -f /opt/dev-vm-ready",
              "test -x /usr/local/bin/k3s || command -v k3s",
              "test -x /usr/local/bin/helm || command -v helm",
              "test -x /usr/local/bin/kubectl || command -v kubectl"
            ]' \
            --query "Command.CommandId" \
            --output text)"

          echo "COMMAND_ID=${COMMAND_ID}"

      - name: Installation summary
        if: always()
        shell: bash
        run: |
          {
            echo "### Dev IaC + VM Bootstrap Status"
            echo ""
            echo "| Item | Value |"
            echo "| ---- | ----- |"
            echo "| Job Status | ${{ job.status }} |"
            echo "| Environment | ${{ env.ENVIRONMENT }} |"
            echo "| Region | ${{ env.AWS_REGION }} |"
            echo "| Project | ${{ env.PROJECT_NAME }} |"
            echo "| ACM Certificate DevApp ARN | ${{ env.ACM_CERTIFICATE_DEV_APP_ARN }} |"          
            echo "| Instance ID | ${{ steps.terraform_outputs.outputs.instance_id || 'N/A' }} |"
            echo "| Public IP | ${{ steps.terraform_outputs.outputs.public_ip || 'N/A' }} |"
            echo "| Load Balancer DNS | ${{ steps.terraform_outputs.outputs.load_balancer_dns_name || 'N/A' }} |"
            echo "| Raw Load Balancer URL | ${{ steps.terraform_outputs.outputs.load_balancer_url || 'N/A' }} |"
            echo "| Application DNS URLs | ${{ steps.terraform_outputs.outputs.application_urls || 'N/A' }} |"
            echo "| App NodePort | ${{ steps.terraform_outputs.outputs.app_nodeport || 'N/A' }} |"
            echo "| Route53 Zone ID | ${{ steps.terraform_outputs.outputs.route53_zone_id || 'N/A' }} |"
            echo "| Route53 Zone Name | ${{ steps.terraform_outputs.outputs.route53_zone_name || 'N/A' }} |"
            echo "| Route53 Name Servers | ${{ steps.terraform_outputs.outputs.route53_name_servers || 'N/A' }} |"
            echo "| Route53 Record Names | ${{ steps.terraform_outputs.outputs.route53_record_names || 'N/A' }} |"
            echo "| K3s Version | ${{ env.K3S_VERSION }} |"
          } >> "$GITHUB_STEP_SUMMARY"
