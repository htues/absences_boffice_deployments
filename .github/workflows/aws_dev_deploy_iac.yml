name: AWS_DEV_DEPLOY_IAC

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: "Type 'deploy' to confirm"
        required: true
        type: string
      environment:
        description: "Environment to deploy (dev only)"
        required: true
        type: choice
        options:
          - dev
        default: dev
      debug_oidc:
        description: "Print OIDC token claims to logs (DANGEROUS)"
        required: false
        type: boolean
        default: false

  workflow_call:
    inputs:
      confirmation:
        required: true
        type: string
      environment:
        required: true
        type: string
      debug_oidc:
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write

env:
  TF_VERSION: "1.10.0"
  TF_IN_AUTOMATION: "true"

  CLUSTER_NAME: ${{ vars.CLUSTER_NAME || 'absencesbo-cluster' }}
  PROJECT_NAME: ${{ vars.APP_NAME || 'absencesbo' }}
  AWS_REGION: ${{ vars.AWS_REGION || 'us-east-2' }}
  ENVIRONMENT: ${{ inputs.environment }}

  BUCKET_NAME: ${{ (vars.APP_NAME || 'absencesbo') }}-terraform-state
  AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}

  K3S_VERSION: "v1.30.2+k3s1"
  KUBECONFIG: "/etc/rancher/k3s/k3s.yaml"
  NODE_NAME: ${{ vars.APP_NAME || 'absencesbo' }}-${{ inputs.environment }}-node
  APP_NODEPORT: "32322"
  NLB_BACKEND_CIDR: "0.0.0.0/0"

concurrency:
  group: AWS_DEV_DEPLOY_IAC-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  deploy-dev-iac:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}

    outputs:
      instance_id: ${{ steps.terraform_outputs.outputs.instance_id }}
      app_nodeport: ${{ steps.terraform_outputs.outputs.app_nodeport }}

    steps:
      - name: Guardrail - confirmation
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ inputs.confirmation }}" != "deploy" ]]; then
            echo "Confirmation failed. You must type 'deploy'."
            exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: (Optional) Debug OIDC token claims
        if: ${{ inputs.debug_oidc }}
        uses: actions/github-script@v7
        with:
          script: |
            const token = await core.getIDToken('sts.amazonaws.com');
            const payload = JSON.parse(Buffer.from(token.split('.')[1], 'base64').toString());
            core.info(`aud=${payload.aud}`);
            core.info(`sub=${payload.sub}`);
            core.info(`iss=${payload.iss}`);
            core.info(`repository=${payload.repository}`);
            core.info(`workflow_ref=${payload.workflow_ref}`);
            core.info(`job_workflow_ref=${payload.job_workflow_ref}`);            

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Validate AWS identity + region
        shell: bash
        run: |
          set -euo pipefail
          aws sts get-caller-identity
          CURRENT_REGION="${AWS_DEFAULT_REGION:-$(aws configure get region)}"
          if [[ "$CURRENT_REGION" != "${AWS_REGION}" ]]; then
            echo "Wrong region configured: $CURRENT_REGION. Must be ${AWS_REGION}"
            exit 1
          fi

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform fmt
        shell: bash
        run: |
          set -euo pipefail
          terraform -chdir=terraform/envs/dev fmt -check -recursive

      - name: Ensure S3 State Bucket Exists
        shell: bash
        env:
          BUCKET_NAME: ${{ env.BUCKET_NAME }}
          AWS_REGION: ${{ env.AWS_REGION }}
        run: |
          set -euo pipefail
          chmod +x terraform/envs/shared/scripts/bootstrap-tf-backend.sh
          terraform/envs/shared/scripts/bootstrap-tf-backend.sh verify

      - name: Terraform init
        shell: bash
        run: |
          set -euo pipefail
          terraform -chdir=terraform/envs/dev init -reconfigure \
            -backend-config="bucket=${{ env.BUCKET_NAME }}" \
            -backend-config="key=${{ env.ENVIRONMENT }}/dev/terraform.tfstate" \
            -backend-config="region=${{ env.AWS_REGION }}" \
            -backend-config="encrypt=true"

      - name: Terraform validate
        shell: bash
        run: |
          set -euo pipefail
          terraform -chdir=terraform/envs/dev validate

      - name: Debug Terraform CLI args
        shell: bash
        run: |
          set -euo pipefail
          env | sort | grep -E '^TF_|^TERRAFORM_' || true

      - name: Terraform plan
        shell: bash
        run: |
          set -euo pipefail
          unset TF_CLI_ARGS_apply
          terraform -chdir=terraform/envs/dev plan \
            -var="aws_region=${{ env.AWS_REGION }}" \
            -var="project_name=${{ env.PROJECT_NAME }}" \
            -var="environment=${{ env.ENVIRONMENT }}" \
            -var="app_nodeport=${{ env.APP_NODEPORT }}" \
            -var='allowed_nodeport_cidrs=["${{ env.NLB_BACKEND_CIDR }}"]' \
            -out=tfplan

      - name: Terraform apply
        shell: bash
        run: |
          set -euo pipefail
          unset TF_CLI_ARGS_apply
          terraform -chdir=terraform/envs/dev apply -auto-approve tfplan

      - name: Export Terraform outputs
        id: terraform_outputs
        shell: bash
        run: |
          set -euo pipefail
          cd terraform/envs/dev

          INSTANCE_ID="$(terraform output -raw instance_id)"
          APP_NODEPORT="$(terraform output -raw app_nodeport)"
          
          if [[ -z "${INSTANCE_ID}" ]]; then
            echo "Terraform output instance_id is empty."
            exit 1
          fi

          if [[ -z "${APP_NODEPORT}" ]]; then
            echo "Terraform output app_nodeport is empty."
            exit 1
          fi

          echo "INSTANCE_ID=${INSTANCE_ID}"
          echo "APP_NODEPORT=${APP_NODEPORT}"

          echo "instance_id=${INSTANCE_ID}" >> "$GITHUB_OUTPUT"
          echo "app_nodeport=${APP_NODEPORT}" >> "$GITHUB_OUTPUT"

      - name: Show application endpoint
        shell: bash
        run: |
          set -euo pipefail
          
          echo "Instance ID: ${{ steps.terraform_outputs.outputs.instance_id }}"
          echo "Public IP: N/A (instance is private)"
          echo "NodePort: ${{ steps.terraform_outputs.outputs.app_nodeport }}"
          echo "Note: Load Balancer and DNS records are managed by the Edge IaC workflow."

      - name: Verify SSM is online
        shell: bash
        run: |
          set -euo pipefail
          INSTANCE_ID="${{ steps.terraform_outputs.outputs.instance_id }}"

          echo "Waiting for SSM to be online for ${INSTANCE_ID}..."
          SSM_STATUS=""
          for i in {1..45}; do
            SSM_STATUS="$(aws ssm describe-instance-information \
              --region "${AWS_REGION}" \
              --filters "Key=InstanceIds,Values=${INSTANCE_ID}" \
              --query 'InstanceInformationList[0].PingStatus' \
              --output text 2>/dev/null || true)"

            if [[ "${SSM_STATUS}" == "Online" ]]; then
              echo "SSM is online."
              break
            fi

            echo "Waiting for SSM... (${i}/45)"
            sleep 10
          done

          if [[ "${SSM_STATUS}" != "Online" ]]; then
            echo "Instance never became available in SSM."
            aws ssm describe-instance-information \
              --region "${AWS_REGION}" \
              --filters "Key=InstanceIds,Values=${INSTANCE_ID}" \
              --query 'InstanceInformationList[].{InstanceId:InstanceId,PingStatus:PingStatus,PlatformName:PlatformName,AgentVersion:AgentVersion,AssociationStatus:AssociationStatus}' \
              --output table || true
            exit 1
          fi

      - name: Setup Ansible virtualenv
        shell: bash
        run: |
          set -euo pipefail

          python3 -m venv .venv-ansible
          source .venv-ansible/bin/activate

          python -m pip install --upgrade pip
          pip install "ansible-core==2.17.13" boto3 botocore
          ansible-galaxy collection install \
            "amazon.aws:==9.2.0" \
            "community.aws:==9.0.0" \
            "community.general:==10.3.0"

          echo "VENV_PYTHON=$PWD/.venv-ansible/bin/python" >> "$GITHUB_ENV"
          echo "VENV_ANSIBLE=$PWD/.venv-ansible/bin/ansible" >> "$GITHUB_ENV"
          echo "VENV_ANSIBLE_PLAYBOOK=$PWD/.venv-ansible/bin/ansible-playbook" >> "$GITHUB_ENV"
          echo "$PWD/.venv-ansible/bin" >> "$GITHUB_PATH"

      - name: Debug Ansible virtualenv
        shell: bash
        run: |
          set -euo pipefail

          "${VENV_PYTHON}" --version
          "${VENV_PYTHON}" -c "import boto3, botocore; print('boto3:', boto3.__version__); print('botocore:', botocore.__version__)"
          "${VENV_ANSIBLE}" --version

      - name: Build dynamic inventory for dev VM
        shell: bash
        env:
          INVENTORY_PATH: terraform/envs/dev/inventory.ini
          INSTANCE_ID: ${{ steps.terraform_outputs.outputs.instance_id }}
        run: |
          set -euo pipefail

          echo "Inventory source values:"
          echo "INSTANCE_ID=${INSTANCE_ID}"

          if [[ -z "${INSTANCE_ID}" ]]; then
            echo "INSTANCE_ID is empty; cannot build SSM inventory."
            exit 1
          fi

          mkdir -p "$(dirname "${INVENTORY_PATH}")"

          cat > "${INVENTORY_PATH}" <<EOF
          [dev_vm]
          dev-node ansible_host=${INSTANCE_ID} ansible_connection=community.aws.aws_ssm ansible_aws_ssm_bucket_name=${BUCKET_NAME} ansible_aws_ssm_region=${AWS_REGION}
          EOF

          echo "Generated inventory:"
          cat "${INVENTORY_PATH}"

      - name: Diagnose Ansible connection plugins
        shell: bash
        run: |
          set -euo pipefail
          echo "Ansible version:"
          ansible --version
          echo
          echo "Installed collections:"
          ansible-galaxy collection list
          echo
          echo "Trying community.aws.aws_ssm:"
          ansible-doc -t connection community.aws.aws_ssm
          echo
          echo "Trying amazon.aws.aws_ssm:"
          ansible-doc -t connection amazon.aws.aws_ssm || true          

      - name: Inspect Ansible role layout
        shell: bash
        run: |
          set -euo pipefail
  
          echo "Current directory: $(pwd)"
          echo "Role tree:"
          find ansible/roles/dev-vm-bootstrap -maxdepth 3 -type f | sort 2>/dev/null || echo "Roles not found"

      - name: Inspect GitOps manifest layout
        shell: bash
        run: |
          set -euo pipefail
          echo "Current directory: $(pwd)"
          find k8s/argocd -maxdepth 4 -type f | sort          

      - name: Check remote OS
        shell: bash
        run: |
          set -euo pipefail
          
          ansible dev-node -i terraform/envs/dev/inventory.ini -m raw -a "cat /etc/os-release" || true

      - name: Run Ansible bootstrap over SSM
        shell: bash
        env:
          ANSIBLE_ROLES_PATH: ansible/roles
        run: |
          set -euo pipefail

          "${VENV_ANSIBLE}" --version
          "${VENV_ANSIBLE_PLAYBOOK}" \
            -i terraform/envs/dev/inventory.ini \
            ansible/playbooks/dev-vm-bootstrap.yml \
            -e "k3s_version=${K3S_VERSION}" \
            -e "node_name=${NODE_NAME}" \
            -e "app_nodeport=${APP_NODEPORT}" \
            -e "kubeconfig_path=${KUBECONFIG}" \
            -e "helm_required=true" \
            -e "ansible_python_interpreter=/usr/bin/python3" \
            --skip-tags never

      - name: Verify VM-ready contract
        shell: bash
        env:
          INSTANCE_ID: ${{ steps.terraform_outputs.outputs.instance_id }}
        run: |
          set -euo pipefail

          if [[ -z "${INSTANCE_ID}" ]]; then
            echo "INSTANCE_ID is empty; cannot verify VM-ready contract."
            exit 1
          fi

          echo "Final verification through SSM..."
          echo "INSTANCE_ID=${INSTANCE_ID}"

          COMMAND_ID="$(aws ssm send-command \
            --region "${AWS_REGION}" \
            --instance-ids "${INSTANCE_ID}" \
            --document-name "AWS-RunShellScript" \
            --comment "Verify dev VM ready contract" \
            --parameters commands='[
              "test -f /opt/dev-vm-ready",
              "test -x /usr/local/bin/k3s || command -v k3s",
              "test -x /usr/local/bin/helm || command -v helm",
              "test -x /usr/local/bin/kubectl || command -v kubectl"
            ]' \
            --query "Command.CommandId" \
            --output text)"

          echo "COMMAND_ID=${COMMAND_ID}"

      - name: Installation summary
        if: always()
        shell: bash
        run: |
          {
            echo "### Dev Compute IaC + VM Bootstrap Status"
            echo ""
            echo "| Item | Value |"
            echo "| ---- | ----- |"
            echo "| Job Status | ${{ job.status }} |"
            echo "| Environment | ${{ env.ENVIRONMENT }} |"
            echo "| Region | ${{ env.AWS_REGION }} |"
            echo "| Project | ${{ env.PROJECT_NAME }} |"
            echo "| Instance ID | ${{ steps.terraform_outputs.outputs.instance_id || 'N/A' }} |"
            echo "| Public IP | N/A (private node) |"
            echo "| App NodePort | ${{ steps.terraform_outputs.outputs.app_nodeport || 'N/A' }} |"
            echo "| K3s Version | ${{ env.K3S_VERSION }} |"
            echo ""
            echo "### Next Steps"
            echo "Run the **AWS DEPLOY EDGE IAC** workflow to configure the Load Balancer and DNS records."
          } >> "$GITHUB_STEP_SUMMARY"
