name: AWS_DEV_BOOTSTRAP

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment to bootstrap"
        required: true
        default: "dev"
        type: choice
        options:
          - dev

      print_oidc_tokens:
        description: "Print OIDC token diagnostics in IaC workflows"
        required: false
        type: boolean
        default: true

permissions:
  contents: read
  id-token: write

concurrency:
  group: AWS_DEV_BOOTSTRAP-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  deploy-dev-iac:
    name: Deploy dev IaC
    uses: ./.github/workflows/aws_dev_deploy_iac.yml
    with:
      confirmation: deploy
      environment: ${{ inputs.environment }}
      debug_oidc: ${{ inputs.print_oidc_tokens }}
    secrets: inherit

  deploy-edge-iac:
    name: Deploy edge IaC
    needs:
      - deploy-dev-iac
    uses: ./.github/workflows/aws_deploy_edge_iac.yml
    with:
      confirmation: deploy
      environment: ${{ inputs.environment }}
      debug_oidc: ${{ inputs.print_oidc_tokens }}
    secrets: inherit

  deploy-codebase:
    name: Deploy dev codebase
    needs:
      - deploy-edge-iac
    uses: ./.github/workflows/aws_dev_deploy_codebase.yml
    with:
      confirmation: deploy
      environment: ${{ inputs.environment }}
    secrets: inherit

  bootstrap-summary:
    name: Bootstrap summary
    needs:
      - deploy-dev-iac
      - deploy-edge-iac
      - deploy-codebase
    if: always()
    runs-on: ubuntu-latest

    steps:
      - name: Write bootstrap summary
        shell: bash
        run: |
          {
            echo "### AWS Dev Bootstrap Summary"
            echo ""
            echo "| Item | Value |"
            echo "| ---- | ----- |"
            echo "| Environment | ${{ inputs.environment }} |"
            echo "| Print OIDC Tokens | ${{ inputs.print_oidc_tokens }} |"
            echo "| Dev IaC Result | ${{ needs.deploy-dev-iac.result }} |"
            echo "| Edge IaC Result | ${{ needs.deploy-edge-iac.result }} |"
            echo "| Codebase Result | ${{ needs.deploy-codebase.result }} |"
            echo ""
            echo "### Execution Order"
            echo ""
            echo "1. aws_dev_deploy_iac"
            echo "2. aws_deploy_edge_iac"
            echo "3. aws_dev_deploy_codebase"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Fail bootstrap if any delegated workflow failed
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${{ needs.deploy-dev-iac.result }}" != "success" ]]; then
            echo "Dev IaC deployment did not succeed: ${{ needs.deploy-dev-iac.result }}"
            exit 1
          fi

          if [[ "${{ needs.deploy-edge-iac.result }}" != "success" ]]; then
            echo "Edge IaC deployment did not succeed: ${{ needs.deploy-edge-iac.result }}"
            exit 1
          fi

          if [[ "${{ needs.deploy-codebase.result }}" != "success" ]]; then
            echo "Codebase deployment did not succeed: ${{ needs.deploy-codebase.result }}"
            exit 1
          fi

          echo "AWS dev bootstrap completed successfully."