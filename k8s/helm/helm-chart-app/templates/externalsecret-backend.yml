{{- if and .Values.database.enabled .Values.database.auth.existingSecret .Values.database.auth.externalSecret.enabled }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Values.database.auth.existingSecret | quote }}
  namespace: {{ .Release.Namespace }}
spec:
  refreshInterval: {{ .Values.database.auth.externalSecret.refreshInterval | default "1h" | quote }}
  secretStoreRef:
    name: {{ .Values.database.auth.externalSecret.secretStoreName | default "aws-secrets-manager" | quote }}
    kind: {{ .Values.database.auth.externalSecret.secretStoreKind | default "SecretStore" | quote }}
  target:
    name: {{ .Values.database.auth.existingSecret | quote }}
    creationPolicy: Owner
  data:
    - secretKey: POSTGRES_USER
      remoteRef:
        key: {{ .Values.database.auth.externalSecret.remoteSecretName | quote }}
        property: POSTGRES_USER
    - secretKey: POSTGRES_PASSWORD
      remoteRef:
        key: {{ .Values.database.auth.externalSecret.remoteSecretName | quote }}
        property: POSTGRES_PASSWORD
    - secretKey: POSTGRES_DB
      remoteRef:
        key: {{ .Values.database.auth.externalSecret.remoteSecretName | quote }}
        property: POSTGRES_DB
    - secretKey: POSTGRES_HOST
      remoteRef:
        key: {{ .Values.database.auth.externalSecret.remoteSecretName | quote }}
        property: POSTGRES_HOST
    - secretKey: POSTGRES_PORT
      remoteRef:
        key: {{ .Values.database.auth.externalSecret.remoteSecretName | quote }}
        property: POSTGRES_PORT
{{- end }}