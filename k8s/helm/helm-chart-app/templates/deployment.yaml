{{- if .Values.database.enabled }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: "{{ .Release.Name }}-database"
  labels:
    app.kubernetes.io/name: "{{ .Chart.Name }}"
    app.kubernetes.io/instance: "{{ .Release.Name }}"
    app.kubernetes.io/component: database
    app.kubernetes.io/managed-by: "{{ .Release.Service }}"
    environment: "{{ .Values.global.environment }}"
spec:
  serviceName: "{{ .Release.Name }}-database"
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: "{{ .Chart.Name }}"
      app.kubernetes.io/instance: "{{ .Release.Name }}"
      app.kubernetes.io/component: database
  template:
    metadata:
      labels:
        app.kubernetes.io/name: "{{ .Chart.Name }}"
        app.kubernetes.io/instance: "{{ .Release.Name }}"
        app.kubernetes.io/component: database
    spec:
      {{- if .Values.database.security.enabled }}
      securityContext:
        {{- if ne .Values.database.security.runAsNonRoot nil }}
        runAsNonRoot: {{ .Values.database.security.runAsNonRoot }}
        {{- end }}
        {{- if ne .Values.database.security.runAsUser nil }}
        runAsUser: {{ .Values.database.security.runAsUser }}
        {{- end }}
        {{- if ne .Values.database.security.fsGroup nil }}
        fsGroup: {{ .Values.database.security.fsGroup }}
        {{- end }}
      {{- end }}
      containers:
        - name: database
          image: "{{ .Values.database.image.repository }}:{{ required "database.image.tag is required" .Values.database.image.tag }}"
          imagePullPolicy: {{ .Values.database.image.pullPolicy }}
          ports:
            - containerPort: 5432
              name: db
              protocol: TCP
          envFrom:
            # Non-sensitive DB props (POSTGRES_USER/POSTGRES_DB/POSTGRES_HOST/POSTGRES_PORT) come from ConfigMap now
            - configMapRef:
                name: "{{ .Release.Name }}-env"
            # Sensitive DB password comes from Secret (ideally synced from AWS Secrets Manager)
            - secretRef:
                name: "{{ default (printf "%s-database" .Release.Name) .Values.database.auth.existingSecret }}"
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
      {{- if .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{ toYaml .Values.global.imagePullSecrets | nindent 8 }}
      {{- end }}
      volumes:
        {{- if not .Values.database.persistence.enabled }}
        - name: data
          emptyDir: {}
        {{- end }}
  {{- if .Values.database.persistence.enabled }}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: "{{ .Values.database.persistence.size }}"
        {{- if .Values.database.persistence.storageClassName }}
        storageClassName: "{{ .Values.database.persistence.storageClassName }}"
        {{- end }}
  {{- end }}
{{- end }}

---
{{- if .Values.backend.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: "{{ .Release.Name }}-backend"
  labels:
    app.kubernetes.io/name: "{{ .Chart.Name }}"
    app.kubernetes.io/instance: "{{ .Release.Name }}"
    app.kubernetes.io/component: backend
    app.kubernetes.io/managed-by: "{{ .Release.Service }}"
    environment: "{{ .Values.global.environment }}"
spec:
  replicas: {{ .Values.backend.deployment.replicas | int }}
  selector:
    matchLabels:
      app.kubernetes.io/name: "{{ .Chart.Name }}"
      app.kubernetes.io/instance: "{{ .Release.Name }}"
      app.kubernetes.io/component: backend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: "{{ .Chart.Name }}"
        app.kubernetes.io/instance: "{{ .Release.Name }}"
        app.kubernetes.io/component: backend
      {{- if and .Values.monitoring.prometheus.scrape .Values.backend.metrics.enabled }}
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "{{ default (toString .Values.backend.service.targetPort) (toString .Values.backend.metrics.port) }}"
        prometheus.io/path: "{{ .Values.backend.metrics.path }}"
      {{- end }}
    spec:
      containers:
        - name: backend
          image: "{{ .Values.backend.image.repository }}:{{ required "backend.image.tag is required" .Values.backend.image.tag }}"
          imagePullPolicy: {{ .Values.backend.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.backend.service.targetPort | int }}
              name: http
          resources:
            requests:
              cpu: "{{ .Values.resources.requests.cpu }}"
              memory: "{{ .Values.resources.requests.memory }}"
            limits:
              cpu: "{{ .Values.resources.limits.cpu }}"
              memory: "{{ .Values.resources.limits.memory }}"
          {{- if .Values.healthChecks.enabled }}
          startupProbe:
            httpGet:
              path: {{ .Values.healthChecks.backend.startup.path | quote }}
              port: {{ .Values.backend.service.targetPort | int }}
            periodSeconds: {{ .Values.healthChecks.backend.startup.periodSeconds | int }}
            timeoutSeconds: {{ .Values.healthChecks.backend.startup.timeoutSeconds | int }}
            failureThreshold: {{ .Values.healthChecks.backend.startup.failureThreshold | int }}
          readinessProbe:
            httpGet:
              path: {{ .Values.healthChecks.backend.readiness.path | quote }}
              port: {{ .Values.backend.service.targetPort | int }}
            initialDelaySeconds: {{ .Values.healthChecks.backend.readiness.initialDelaySeconds | int }}
            periodSeconds: {{ .Values.healthChecks.backend.readiness.periodSeconds | int }}
            timeoutSeconds: {{ .Values.healthChecks.backend.readiness.timeoutSeconds | int }}
            failureThreshold: {{ .Values.healthChecks.backend.readiness.failureThreshold | int }}
          livenessProbe:
            httpGet:
              path: {{ .Values.healthChecks.backend.liveness.path | quote }}
              port: {{ .Values.backend.service.targetPort | int }}
            initialDelaySeconds: {{ .Values.healthChecks.backend.liveness.initialDelaySeconds | int }}
            periodSeconds: {{ .Values.healthChecks.backend.liveness.periodSeconds | int }}
            timeoutSeconds: {{ .Values.healthChecks.backend.liveness.timeoutSeconds | int }}
            failureThreshold: {{ .Values.healthChecks.backend.liveness.failureThreshold | int }}
          {{- end }}
          envFrom:
            # Non-sensitive runtime config (EXECUTION_MODE, SEED_ENABLED, etc.)
            - configMapRef:
                name: "{{ .Release.Name }}-env"
            # Sensitive DB props (POSTGRES_*) from existingSecret (ideally created via External Secrets from AWS Secrets Manager)
            - secretRef:
                name: "{{ default (printf "%s-database" .Release.Name) .Values.database.auth.existingSecret }}"
      {{- if .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{ toYaml .Values.global.imagePullSecrets | nindent 8 }}
      {{- end }}
      {{- if .Values.security.enabled }}
      securityContext:
        runAsNonRoot: {{ .Values.security.runAsNonRoot }}
        runAsUser: {{ .Values.security.runAsUser }}
      {{- end }}
{{- end }}

---
{{- if .Values.frontend.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: "{{ .Release.Name }}-frontend"
  labels:
    app.kubernetes.io/name: "{{ .Chart.Name }}"
    app.kubernetes.io/instance: "{{ .Release.Name }}"
    app.kubernetes.io/component: frontend
    app.kubernetes.io/managed-by: "{{ .Release.Service }}"
    environment: "{{ .Values.global.environment }}"
spec:
  replicas: {{ .Values.frontend.deployment.replicas | int }}
  selector:
    matchLabels:
      app.kubernetes.io/name: "{{ .Chart.Name }}"
      app.kubernetes.io/instance: "{{ .Release.Name }}"
      app.kubernetes.io/component: frontend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: "{{ .Chart.Name }}"
        app.kubernetes.io/instance: "{{ .Release.Name }}"
        app.kubernetes.io/component: frontend
      {{- if and .Values.monitoring.prometheus.scrape .Values.frontend.metrics.enabled }}
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "{{ default (toString .Values.frontend.service.targetPort) (toString .Values.frontend.metrics.port) }}"
        prometheus.io/path: "{{ .Values.frontend.metrics.path }}"
      {{- end }}
    spec:
      containers:
        - name: frontend
          image: "{{ .Values.frontend.image.repository }}:{{ required "frontend.image.tag is required" .Values.frontend.image.tag }}"
          imagePullPolicy: {{ .Values.frontend.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.frontend.service.targetPort | int }}
              name: http
          env:
