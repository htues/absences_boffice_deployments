{{- if .Values.database.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: "{{ .Release.Name }}-database"
  labels:
    app.kubernetes.io/name: "{{ .Chart.Name }}"
    app.kubernetes.io/instance: "{{ .Release.Name }}"
    app.kubernetes.io/component: database
    environment: "{{ .Values.global.environment }}"
spec:
  selector:
    app.kubernetes.io/name: "{{ .Chart.Name }}"
    app.kubernetes.io/instance: "{{ .Release.Name }}"
    app.kubernetes.io/component: database
  ports:
    - name: db
      protocol: TCP
      port: {{ .Values.database.service.port | int }}
      targetPort: {{ .Values.database.service.targetPort | int }}
  type: "{{ .Values.database.service.type }}"
{{- end }}

---
{{- if .Values.backend.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: "{{ .Release.Name }}-backend"
  labels:
    app.kubernetes.io/name: "{{ .Chart.Name }}"
    app.kubernetes.io/instance: "{{ .Release.Name }}"
    app.kubernetes.io/component: backend
    environment: "{{ .Values.global.environment }}"
spec:
  selector:
    app.kubernetes.io/name: "{{ .Chart.Name }}"
    app.kubernetes.io/instance: "{{ .Release.Name }}"
    app.kubernetes.io/component: backend
  ports:
    - name: http
      protocol: TCP
      port: {{ .Values.backend.service.port | int }}
      targetPort: {{ .Values.backend.service.targetPort | int }}
  type: "{{ .Values.backend.service.type }}"
{{- end }}

---
{{- if .Values.frontend.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: "{{ .Release.Name }}-frontend"
  labels:
    app.kubernetes.io/name: "{{ .Chart.Name }}"
    app.kubernetes.io/instance: "{{ .Release.Name }}"
    app.kubernetes.io/component: frontend
    environment: "{{ .Values.global.environment }}"
spec:
  selector:
    app.kubernetes.io/name: "{{ .Chart.Name }}"
    app.kubernetes.io/instance: "{{ .Release.Name }}"
    app.kubernetes.io/component: frontend
  ports:
    - name: http
      protocol: TCP
      port: {{ .Values.frontend.service.port | int }}
      targetPort: {{ .Values.frontend.service.targetPort | int }}
  type: "{{ .Values.frontend.service.type }}"
{{- end }}

---
{{- if .Values.nginx.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: "{{ .Release.Name }}-nginx"
  labels:
    app.kubernetes.io/name: "{{ .Chart.Name }}"
    app.kubernetes.io/instance: "{{ .Release.Name }}"
    app.kubernetes.io/component: nginx
    environment: "{{ .Values.global.environment }}"
  {{- with .Values.nginx.service.annotations }}
  annotations:
    {{ toYaml . | nindent 4 }}
  {{- end }}
spec:
  selector:
    app.kubernetes.io/name: "{{ .Chart.Name }}"
    app.kubernetes.io/instance: "{{ .Release.Name }}"
    app.kubernetes.io/component: nginx
  ports:
    - name: http
      protocol: TCP
      port: {{ .Values.nginx.service.port | int }}
      targetPort: {{ .Values.nginx.service.targetPort | int }}
      {{- if and (eq .Values.nginx.service.type "NodePort") .Values.nginx.service.nodePort }}
      nodePort: {{ .Values.nginx.service.nodePort | int }}
      {{- end }}
  type: "{{ .Values.nginx.service.type }}"
  {{- if .Values.nginx.service.externalTrafficPolicy }}
  externalTrafficPolicy: "{{ .Values.nginx.service.externalTrafficPolicy }}"
  {{- end }}
{{- end }}
