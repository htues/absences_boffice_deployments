{{- if .Values.nginx.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: "{{ .Release.Name }}-nginx-config"
  labels:
    app.kubernetes.io/name: "{{ .Chart.Name }}"
    app.kubernetes.io/instance: "{{ .Release.Name }}"
    app.kubernetes.io/component: nginx
    app.kubernetes.io/managed-by: "{{ .Release.Service }}"
    environment: "{{ .Values.global.environment }}"
data:
  nginx.conf: |
    worker_processes auto;

    events {
        worker_connections 1024;
    }

    http {
        include       /etc/nginx/mime.types;
        default_type  application/octet-stream;

        log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                        '$status $body_bytes_sent "$http_referer" '
                        '"$http_user_agent" "$http_x_forwarded_for"';

        access_log  /var/log/nginx/access.log main;
        error_log   /var/log/nginx/error.log warn;

        sendfile on;
        keepalive_timeout 65;
        map $http_origin $cors_origin {
            default "";
            "http://localhost" "http://localhost";
            "http://localhost:8041" "http://localhost:8041";
            "https://dev.tamayo.dev/absencesbo" "https://dev.tamayo.dev/absencesbo";
            "https://stg.tamayo.dev/absencesbo" "https://stg.tamayo.dev/absencesbo";
            "https://apps.tamayo.dev/absencesbo" "https://apps.tamayo.dev/absencesbo";
        }
        
          server {
              listen 80;
              server_name _;

              location /api/ {
                      proxy_pass http://{{ .Release.Name }}-backend:{{ .Values.nginx.upstreams.backendPort }};
                      proxy_http_version 1.1;
                      proxy_set_header Host $host;
                      proxy_set_header X-Real-IP $remote_addr;
                      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                      proxy_set_header X-Forwarded-Proto $scheme;
                      
                      add_header Access-Control-Allow-Origin "$cors_origin" always;
                      add_header Vary "Origin" always;                      
              }

              location = /index.html {
                      proxy_pass http://{{ .Release.Name }}-frontend:{{ .Values.nginx.upstreams.frontendPort }};
                      proxy_http_version 1.1;
                      proxy_set_header Host $host;
                      proxy_set_header X-Real-IP $remote_addr;
                      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                      proxy_set_header X-Forwarded-Proto https;

                      add_header Cache-Control "no-cache, no-store, must-revalidate" always;
              }

              location /assets/ {
                      proxy_pass http://{{ .Release.Name }}-frontend:{{ .Values.nginx.upstreams.frontendPort }};
                      proxy_http_version 1.1;
                      proxy_set_header Host $host;
                      proxy_set_header X-Real-IP $remote_addr;
                      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                      proxy_set_header X-Forwarded-Proto https;

                      add_header Cache-Control "public, max-age=31536000, immutable" always;
              }

              location / {
                      proxy_pass http://{{ .Release.Name }}-frontend:{{ .Values.nginx.upstreams.frontendPort }};

                      proxy_http_version 1.1;
                      proxy_set_header Upgrade $http_upgrade;
                      proxy_set_header Connection 'upgrade';
                      proxy_set_header Host $host;
                      proxy_set_header X-Real-IP $remote_addr;
                      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                      proxy_set_header X-Forwarded-Proto https;

                      add_header Cache-Control "no-cache, no-store, must-revalidate" always;
              }

              location = /healthz {
                      access_log off;
                      default_type text/plain;
                      return 200 "ok\n";
              }
        }
    }
{{- end }}
