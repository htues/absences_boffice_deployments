# fallback/manual local secret path
{{- if and .Values.database.enabled (not .Values.database.auth.existingSecret) -}}
{{- $secretName := printf "%s-database" .Release.Name -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName | quote }}
  labels:
    app.kubernetes.io/name: {{ .Chart.Name | quote }}
    app.kubernetes.io/instance: {{ .Release.Name | quote }}
    app.kubernetes.io/component: database
    app.kubernetes.io/managed-by: {{ .Release.Service | quote }}
type: Opaque
stringData:
  POSTGRES_USER: {{ .Values.database.auth.username | default "app" | quote }}
  POSTGRES_PASSWORD: {{ required "database.auth.password is required when database.auth.existingSecret is not set (or use AWS Secrets Manager + External Secrets)" .Values.database.auth.password | quote }}
  POSTGRES_DB: {{ .Values.database.auth.database | default "absencesbo" | quote }}
  POSTGRES_HOST: {{ printf "%s-database" .Release.Name | quote }}
  POSTGRES_PORT: {{ .Values.database.service.port | default 5432 | toString | quote }}
{{- end }}