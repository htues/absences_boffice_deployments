---
k3s_version: "v1.30.2+k3s1"
node_name: ""
helm_required: true
app_nodeport: 32322
bootstrap_user: "ubuntu"
kubectl_path: "/usr/local/bin/kubectl"
k3s_path: "/usr/local/bin/k3s"

# ArgoCD bootstrap
argocd_install_enabled: true
argocd_namespace: "argocd"

# Option A: install ArgoCD using official manifests
argocd_install_method: "manifest"
argocd_manifest_url: "https://raw.githubusercontent.com/argoproj/argo-cd/stable/manifests/install.yaml"

# Option B: install ArgoCD using Helm chart
#argocd_helm_repo_name: "argo"
#argocd_helm_repo_url: "https://argoproj.github.io/argo-helm"
#argocd_helm_chart: "argo/argo-cd"
#argocd_helm_chart_version: "8.3.0"
#argocd_helm_release_name: "argocd"

# Readiness wait
argocd_wait_timeout_seconds: 300

# ArgoCD application bootstrap manifests
argocd_apply_app_manifests: true
argocd_project_manifest_path: "k8s/argocd/projects/absencesbo-project.yml"
argocd_app_manifest_path: "k8s/argocd/envs/dev/absencesbo-dev-application.yml"
argocd_namespace_manifest_path: "k8s/argocd/envs/dev/absencesbo-dev-namespace.yml"