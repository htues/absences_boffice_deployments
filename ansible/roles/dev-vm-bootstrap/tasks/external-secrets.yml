---
- name: Add External Secrets Helm repository
  become: true
  ansible.builtin.command: >-
    helm repo add external-secrets https://charts.external-secrets.io --force-update
  register: external_secrets_repo_add
  changed_when: "'has been added' in external_secrets_repo_add.stdout or 'has been updated' in external_secrets_repo_add.stdout"

- name: Update Helm repositories
  become: true
  ansible.builtin.command: helm repo update
  register: external_secrets_repo_update
  changed_when: false

- name: Install or upgrade External Secrets Operator
  become: true
  ansible.builtin.command: >-
    helm upgrade --install external-secrets external-secrets/external-secrets
    --namespace external-secrets
    --create-namespace
    --set installCRDs=true
  register: external_secrets_helm_install
  changed_when: >-
    'Release "external-secrets" does not exist' in external_secrets_helm_install.stdout
    or 'has been upgraded' in external_secrets_helm_install.stdout
    or 'has been installed' in external_secrets_helm_install.stdout

- name: Wait for External Secrets Operator pods to be ready
  become: true
  ansible.builtin.command: >-
    {{ k3s_path }} kubectl wait
    --namespace external-secrets
    --for=condition=Ready
    pod
    --selector=app.kubernetes.io/name=external-secrets
    --timeout=300s
  register: external_secrets_pods_ready
  changed_when: false

- name: Verify ExternalSecret CRD exists
  become: true
  ansible.builtin.command: "{{ k3s_path }} kubectl get crd externalsecrets.external-secrets.io"
  register: external_secrets_crd_verify
  changed_when: false

- name: Verify SecretStore CRD exists
  become: true
  ansible.builtin.command: "{{ k3s_path }} kubectl get crd secretstores.external-secrets.io"
  register: external_secrets_secretstore_crd_verify
  changed_when: false

- name: Verify ClusterSecretStore CRD exists
  become: true
  ansible.builtin.command: "{{ k3s_path }} kubectl get crd clustersecretstores.external-secrets.io"
  register: external_secrets_clustersecretstore_crd_verify
  changed_when: false

- name: Show External Secrets Operator summary
  ansible.builtin.debug:
    msg:
      - "External Secrets Operator installed/updated."
      - "Namespace: external-secrets"
      - "CRDs verified:"
      - "- externalsecrets.external-secrets.io"
      - "- secretstores.external-secrets.io"
      - "- clustersecretstores.external-secrets.io"