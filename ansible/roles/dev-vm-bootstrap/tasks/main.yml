---
- name: Run prerequisite setup
  ansible.builtin.import_tasks: prereqs.yml

- name: Install and configure k3s
  ansible.builtin.import_tasks: k3s.yml

- name: Install and configure tools
  ansible.builtin.import_tasks: tools.yml

- name: Install and configure ArgoCD
  ansible.builtin.import_tasks: argocd.yml
  when: argocd_install_enabled | bool

- name: Ensure application directory exists
  ansible.builtin.file:
    path: /opt/dev-codebase
    state: directory
    mode: "0755"

- name: Set Helm chart directory for deployment
  ansible.builtin.set_fact:
    helm_chart_dir: /opt/dev-codebase/helm-chart-app-dev

- name: Verify VM readiness
  ansible.builtin.import_tasks: verify.yml