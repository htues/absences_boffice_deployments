---
- name: Verify k3s node is reachable
  become: true
  ansible.builtin.command: "{{ k3s_path }} kubectl get nodes"
  register: k3s_get_nodes
  retries: 60
  delay: 5
  until: k3s_get_nodes.rc == 0
  changed_when: false

- name: Show k3s nodes in wide format
  become: true
  ansible.builtin.command: "{{ k3s_path }} kubectl get nodes -o wide"
  register: k3s_nodes_wide
  changed_when: false

- name: Capture raw node status
  become: true
  ansible.builtin.command: "{{ k3s_path }} kubectl get nodes --no-headers"
  register: k3s_nodes_raw
  changed_when: false

- name: Assert the node is Ready
  ansible.builtin.assert:
    that:
      - k3s_nodes_raw.stdout is search('Ready')
    fail_msg: >-
      The node is not Ready yet.
      kubectl output:
      {{ k3s_nodes_raw.stdout }}
    success_msg: "The node is Ready."

- name: Verify k3s binary is available
  become: true
  ansible.builtin.command: "{{ k3s_path }} --version"
  register: k3s_version_check
  changed_when: false

- name: Verify kubectl symlink is available
  become: true
  ansible.builtin.command: "{{ kubectl_path }} version --client=true"
  register: kubectl_client_version
  changed_when: false

- name: Verify Helm is available
  become: true
  ansible.builtin.command: helm version --short
  register: helm_version
  changed_when: false

- name: Verify ArgoCD namespace exists
  become: true
  ansible.builtin.command: "{{ k3s_path }} kubectl get namespace {{ argocd_namespace }}"
  register: argocd_namespace_verify
  changed_when: false
  when: argocd_install_enabled | bool

- name: Verify ArgoCD pods are running
  become: true
  ansible.builtin.command: "{{ k3s_path }} kubectl get pods -n {{ argocd_namespace }} --no-headers"
  register: argocd_pods_verify
  changed_when: false
  when: argocd_install_enabled | bool

- name: Assert ArgoCD pods are running
  ansible.builtin.assert:
    that:
      - argocd_pods_verify.stdout is search('Running')
      - argocd_pods_verify.stdout is not search('CrashLoopBackOff')
      - argocd_pods_verify.stdout is not search('Error')
      - argocd_pods_verify.stdout is not search('ImagePullBackOff')
    fail_msg: >-
      ArgoCD pods are not healthy.
      kubectl output:
      {{ argocd_pods_verify.stdout }}
    success_msg: "ArgoCD pods are running."
  when: argocd_install_enabled | bool

- name: Verify argocd-server service exists
  become: true
  ansible.builtin.command: "{{ k3s_path }} kubectl get service argocd-server -n {{ argocd_namespace }}"
  register: argocd_server_service_verify
  changed_when: false
  when: argocd_install_enabled | bool

- name: Assert app NodePort contract is valid
  ansible.builtin.assert:
    that:
      - app_nodeport | int >= 30000
      - app_nodeport | int <= 32767
    fail_msg: "app_nodeport must be within Kubernetes NodePort range (30000-32767)."
    success_msg: "app_nodeport contract is valid: {{ app_nodeport }}"

- name: Show verification summary
  ansible.builtin.debug:
    msg:
      - "k3s kubectl get nodes succeeded"
      - "k3s kubectl get nodes -o wide:"
      - "{{ k3s_nodes_wide.stdout }}"
      - "app_nodeport contract: {{ app_nodeport }}"
      - "kubectl version: {{ kubectl_version.stdout | default('unknown') }}"
      - "helm version: {{ helm_version.stdout | default('unknown') }}"
      - "ArgoCD enabled: {{ argocd_install_enabled }}"
      - "ArgoCD namespace: {{ argocd_namespace if argocd_install_enabled else 'disabled' }}"
      - "ArgoCD pods:"
      - "{{ argocd_pods_verify.stdout | default('ArgoCD verification skipped') }}"