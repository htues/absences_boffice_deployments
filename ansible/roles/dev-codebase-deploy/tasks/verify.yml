---
- name: Verify Helm release is present
  ansible.builtin.command:
    cmd: "helm status {{ release_name }} -n {{ namespace_name }}"
  environment:
    KUBECONFIG: "{{ kubeconfig_path }}"
  register: helm_status_result
  changed_when: false

- name: Show Helm release status
  ansible.builtin.debug:
    msg:
      - "Release: {{ release_name }}"
      - "Namespace: {{ namespace_name }}"
      - "Chart: {{ helm_chart_dir }}"
      - "Database enabled: {{ deploy_database | bool }}"
      - "Backend enabled: {{ deploy_backend | bool }}"
      - "Frontend enabled: {{ deploy_frontend | bool }}"
      - "Nginx enabled: {{ deploy_nginx | bool }}"
      - "Database tag: {{ database_tag | default('') }}"
      - "Backend tag: {{ backend_tag | default('') }}"
      - "Frontend tag: {{ frontend_tag | default('') }}"
      - "Nginx tag: {{ nginx_tag | default('') }}"
      - "Helm status: {{ helm_status_result.stdout | default('') }}"

- name: Check namespace resources
  ansible.builtin.command:
    cmd: "kubectl get all -n {{ namespace_name }}"
  environment:
    KUBECONFIG: "{{ kubeconfig_path }}"
  register: kubectl_get_all_result
  changed_when: false

- name: Show namespace resources
  ansible.builtin.debug:
    var: kubectl_get_all_result.stdout_lines

- name: Check pods are ready
  ansible.builtin.command:
    cmd: "kubectl get pods -n {{ namespace_name }} -o wide"
  environment:
    KUBECONFIG: "{{ kubeconfig_path }}"
  register: kubectl_pods_result
  changed_when: false

- name: Show pod status
  ansible.builtin.debug:
    var: kubectl_pods_result.stdout_lines

- name: Wait for backend deployment rollout when enabled
  ansible.builtin.command:
    cmd: kubectl rollout status deployment/{{ release_name }}-backend -n {{ namespace_name }} --timeout={{ helm_wait_timeout | default('5m') }}
  environment:
    KUBECONFIG: "{{ kubeconfig_path }}"
  changed_when: false
  when: deploy_backend | bool

- name: Wait for frontend deployment rollout when enabled
  ansible.builtin.command:
    cmd: kubectl rollout status deployment/{{ release_name }}-frontend -n {{ namespace_name }} --timeout={{ helm_wait_timeout | default('5m') }}
  environment:
    KUBECONFIG: "{{ kubeconfig_path }}"
  changed_when: false
  when: deploy_frontend | bool

- name: Wait for nginx deployment rollout when enabled
  ansible.builtin.command:
    cmd: kubectl rollout status deployment/{{ release_name }}-nginx -n {{ namespace_name }} --timeout={{ helm_wait_timeout | default('5m') }}
  environment:
    KUBECONFIG: "{{ kubeconfig_path }}"
  changed_when: false
  when: deploy_nginx | default(true) | bool

- name: Wait for database statefulset rollout when enabled
  ansible.builtin.command:
    cmd: kubectl rollout status statefulset/{{ release_name }}-database -n {{ namespace_name }} --timeout={{ helm_wait_timeout | default('5m') }}
  environment:
    KUBECONFIG: "{{ kubeconfig_path }}"
  changed_when: false
  when: deploy_database | bool

- name: Verify all active pods are Running and containers are Ready
  ansible.builtin.shell: |
    set -euo pipefail

    POD_COUNT="$(kubectl get pods -n "{{ namespace_name }}" --no-headers 2>/dev/null | wc -l)"

    if [[ "${POD_COUNT}" -eq 0 ]]; then
      echo "No pods found in namespace {{ namespace_name }}."
      exit 1
    fi

    UNHEALTHY_PODS="$(
      kubectl get pods -n "{{ namespace_name }}" -o json | \
      "{{ ansible_python_interpreter | default('/usr/bin/python3') }}" -c '
    import json
    import sys

    data = json.load(sys.stdin)
    unhealthy = []

    for pod in data.get("items", []):
        metadata = pod.get("metadata", {})
        status = pod.get("status", {})
        spec = pod.get("spec", {})

        name = metadata.get("name", "<unknown>")
        deletion_timestamp = metadata.get("deletionTimestamp")
        phase = status.get("phase", "")
        restart_policy = spec.get("restartPolicy", "")

        if deletion_timestamp:
            continue

        if phase == "Succeeded" and restart_policy != "Always":
            continue

        if phase != "Running":
            unhealthy.append(f"{name}: phase={phase}")
            continue

        container_statuses = status.get("containerStatuses", [])
        if not container_statuses:
            unhealthy.append(f"{name}: no container statuses found")
            continue

        not_ready = [
            container.get("name", "<unknown>")
            for container in container_statuses
            if not container.get("ready", False)
        ]

        if not_ready:
            unhealthy.append(f"{name}: containers not ready={','.join(not_ready)}")

    for item in unhealthy:
        print(item)

    sys.exit(1 if unhealthy else 0)
    ' || true
    )"

    if [[ -n "${UNHEALTHY_PODS}" ]]; then
      echo "Unhealthy active pods found:"
      echo "${UNHEALTHY_PODS}"
      exit 1
    fi

    echo "All active pods in namespace {{ namespace_name }} are healthy. Terminating rollout pods were ignored."
  args:
    executable: /bin/bash
  environment:
    KUBECONFIG: "{{ kubeconfig_path }}"
  register: active_pods_health_result
  changed_when: false

- name: Parse pod readiness information
  ansible.builtin.set_fact:
    pod_health_report: "{{ kubectl_pods_json_result.stdout | from_json }}"
