---
- name: Ensure Docker Hub pull secret exists
  ansible.builtin.shell: |
    set -euo pipefail
    kubectl -n "{{ namespace_name }}" create secret docker-registry regcred \
      --docker-server="https://index.docker.io/v1/" \
      --docker-username="{{ docker_hub_username }}" \
      --docker-password="{{ docker_hub_pat }}" \
      --docker-email="{{ docker_hub_email }}" \
      --dry-run=client -o yaml | kubectl apply -f -
  args:
    executable: /bin/bash
  environment:
    KUBECONFIG: "{{ kubeconfig_path }}"
  become: true
  changed_when: true
  no_log: true

- name: Ensure database secret exists when database or backend is deployed
  ansible.builtin.shell: |
    set -euo pipefail
    kubectl -n "{{ namespace_name }}" create secret generic "{{ db_secret_name }}" \
      --from-literal="{{ db_secret_key }}={{ postgres_password }}" \
      --dry-run=client -o yaml | kubectl apply -f -
  args:
    executable: /bin/bash
  environment:
    KUBECONFIG: "{{ kubeconfig_path }}"
  become: true
  when: deploy_database | bool or deploy_backend | bool
  changed_when: true
  no_log: true